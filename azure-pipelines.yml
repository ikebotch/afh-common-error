trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
- name: runTests
  value: 'false'

- name: repoRoot
  value: '.'
- name: solution
  value: 'AFH.Common.Errors.sln'
- name: sdkProjects
  value: |
    src/AFH.Common.Errors/AFH.Common.Errors.csproj
    src/AFH.Common.Errors.AzureFunctions/AFH.Common.Errors.AzureFunctions.csproj
    src/AFH.Common.Errors.ApplicationInsights/AFH.Common.Errors.ApplicationInsights.csproj
    src/AFH.Common.Errors.Email/AFH.Common.Errors.Email.csproj
    src/AFH.Common.Errors.EntityFramework/AFH.Common.Errors.EntityFramework.csproj
- name: testProjects
  value: 'tests/**/*.csproj'
- name: buildConfiguration
  value: 'Release'
- name: dotnetVersion
  value: '10.0.x'

stages:
# ============================================================
# BUILD & TEST
# ============================================================
- stage: BuildAndTest
  displayName: 'Build & Test'
  jobs:
  - job: Build
    displayName: 'Restore & Build'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '$(dotnetVersion)'

    - task: NuGetToolInstaller@1

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate to Azure Artifacts'

    - task: DotNetCoreCLI@2
      displayName: 'Restore (solution)'
      inputs:
        command: restore
        projects: '$(solution)'
        feedsToUse: 'select'
        vstsFeed: '$(artifactFeed)'

    - task: DotNetCoreCLI@2
      displayName: 'Build (solution)'
      inputs:
        command: build
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

  # ---------------------------
  # TEST JOB (OPTIONAL)
  # ---------------------------
  - job: Test
    displayName: 'Run tests'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['runTests'], 'true'))
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '$(dotnetVersion)'

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate to Azure Artifacts'

    - task: DotNetCoreCLI@2
      displayName: 'Test'
      inputs:
        command: test
        projects: '$(testProjects)'
        arguments: '--configuration $(buildConfiguration) --logger trx'

# ============================================================
# PACK & PUBLISH
# ============================================================
- stage: PackAndPublish
  displayName: 'Pack & Publish SDK'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: Pack
    displayName: 'Pack & Push NuGet'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '$(dotnetVersion)'

    - task: NuGetToolInstaller@1

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate to Azure Artifacts'

    - task: DotNetCoreCLI@2
      displayName: 'Restore (SDK projects)'
      inputs:
        command: restore
        projects: '$(sdkProjects)'
        feedsToUse: 'select'
        vstsFeed: '$(artifactFeed)'

    - task: DotNetCoreCLI@2
      displayName: 'Build (SDK projects)'
      inputs:
        command: build
        projects: '$(sdkProjects)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Pack (no-build)'
      inputs:
        command: pack
        packagesToPack: '$(sdkProjects)'
        configuration: '$(buildConfiguration)'
        includesymbols: true
        outputDir: '$(Build.ArtifactStagingDirectory)'
        nobuild: true

    - task: DotNetCoreCLI@2
      displayName: 'Push (Azure Artifacts)'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        command: push
        packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg;!$(Build.ArtifactStagingDirectory)/*.snupkg'
        nuGetFeedType: 'internal'
        publishVstsFeed: '$(artifactFeed)'
